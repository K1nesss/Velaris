name: 功能请求
description: 提交一个新功能或改进建议
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        欢迎提交功能建议，请尽量说明业务价值与使用场景。

  - type: input
    id: summary
    attributes:
      label: 功能标题
      placeholder: 例如：新增游戏会话导出为 CSV
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 背景与问题
      description: 当前遇到什么问题，为什么需要这个功能
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 方案描述
      description: 你期望的行为、交互或数据结构
      placeholder: |
        - 入口位置：
        - 用户流程：
        - 关键字段：
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否有其他可行方案

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 建议使用可检验的条目
      placeholder: |
        - [ ] 可在 ... 页面看到 ...
        - [ ] 数据可被正确保存
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 其他补充
      description: 可以贴参考链接、草图、截图
