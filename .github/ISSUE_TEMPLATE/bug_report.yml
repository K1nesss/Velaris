name: 缺陷反馈
description: 报告一个可复现的问题
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈，请尽量提供可复现信息，便于快速定位问题。

  - type: input
    id: summary
    attributes:
      label: 问题简述
      description: 用一句话描述问题
      placeholder: 例如：切换到 Analytics 页面后应用卡死
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序填写
      placeholder: |
        1. 打开应用
        2. 点击 ...
        3. 看到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      placeholder: 应该发生什么
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      placeholder: 实际发生了什么
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: 运行环境
      options:
        - Windows
        - macOS
        - Linux
        - 其他
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志/截图
      description: 粘贴错误日志或附上截图
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: 其他补充
      description: 任何有助于排查的信息
